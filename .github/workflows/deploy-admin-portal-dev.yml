name: Deploy Admin Portal Dev

on:
  push:
    branches:
      - main
    paths:
      - web/admin-portal/**
      - .github/workflows/deploy-admin-portal-dev.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Admin Portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/admin-portal
          output_location: ""
          skip_app_build: true
