name: Deploy Game View Dev (SWA)

on:
  push:
    branches:
      - main
    paths:
      - web/game-view/**
      - .github/workflows/deploy-game-view-dev-swa.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - web/game-view/**
      - .github/workflows/deploy-game-view-dev-swa.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Game View
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GAMEVIEW_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/game-view
          api_location: ""
          output_location: dist
          app_build_command: npm ci && npm run build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Preview Environment
    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GAMEVIEW_DEV }}
          action: close
