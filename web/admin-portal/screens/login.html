<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TipIn Admin Login</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />

    <!-- Only the CSS needed for this page -->
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/admin-shared.css" />
  </head>

  <body class="login-body">
    <div class="login-split">
      <!-- LEFT SIDE -->
      <div class="login-left">
        <img src="../assets/TipIn_Default_Logo.jpg" alt="TipIn Logo" />
        <h1>TipIn Admin Portal</h1>
        <p>Manage organizations, teams, rosters, and system settings</p>
      </div>

      <!-- RIGHT SIDE -->
      <div class="login-right">
        <h2>Sign In</h2>

        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="nf-input"
          placeholder="you@example.com"
        />

        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          class="nf-input"
          placeholder="••••••••"
        />

        <button id="btnLogin" class="nf-btn nf-btn-primary full-width">
          Log In
        </button>

        <p id="login-error" class="login-error"></p>
      </div>
    </div>

    <!-- Auth helper + login logic -->
    <script src="../js/auth.js"></script>
    <script src="../js/config-loader.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
