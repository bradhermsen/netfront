<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Rosters | NetFront Admin</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/rosters.css" />
</head>

<body>
    <div class="layout">
        <div id="sidebarContainer"></div>

        <div class="main-content">
            <h1 class="page-header">Team Rosters</h1>

            <table class="data-table" id="rosterTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Player Name</th>
                        <th>Pos</th>
                        <th>Grade</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rosterBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editPlayerModal" class="modal hidden">
        <div class="modal-content">
            <h2>Edit Roster Entry</h2>

            <label>Jersey Number</label>
            <input id="editJersey" type="number" class="input-text" />

            <label>Position</label>
            <input id="editPosition" type="text" class="input-text" />

            <label>Grade</label>
            <input id="editGrade" type="number" class="input-text" />

            <label>Status</label>
            <select id="editStatus" class="input-select">
                <option value="Active">Active</option>
                <option value="Scratched">Scratched</option>
            </select>

            <label>Notes</label>
            <textarea id="editNotes" class="input-text"></textarea>

            <div class="modal-actions">
                <button id="editPlayerSave" class="btn-primary">Save</button>
                <button class="btn-secondary modal-close">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Sidebar Loader -->
    <script src="../js/sidebar-loader.js"></script>
    <script>loadSidebar();</script>

    <!-- Page Logic -->
    <script src="../js/rosters.js"></script>
</body>
</html>
