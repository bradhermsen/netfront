<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Rosters | NetFront Admin</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/rosters.css" />
</head>

<body>

    <!-- LAYOUT -->
    <div id="layoutContainer"></div>

    <script>
        fetch("../components/layout.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("layoutContainer").innerHTML = html;

                // Inject page content
                document.getElementById("pageContent").innerHTML = `
                    <h1 class="page-header">Team Rosters</h1>

                    <div id="globalRosterControls"></div>

                    <table class="data-table" id="teamsRosterTable">
                        <thead>
                            <tr>
                                <th>Team Name</th>
                                <th>Organization</th>
                                <th>Roster Count</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teamsRosterBody"></tbody>
                    </table>
                `;
            });
    </script>

    <!-- ============================
         ADD / EDIT ROSTER ENTRY MODAL
    ============================= -->
    <div id="rosterModal" class="modal hidden">
        <div class="modal-content modal-dark">
            <h2 id="rosterModalTitle">Edit Roster Entry</h2>

            <div class="modal-body">

                <label>Player</label>
                <select id="rosterPlayerId" class="form-select"></select>

                <label>Jersey Number</label>
                <input id="rosterJersey" type="number" class="form-control" />

                <label>Position</label>
                <input id="rosterPosition" type="text" class="form-control" />

                <label>Status</label>
                <select id="rosterStatus" class="form-select">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

            </div>

            <div class="modal-actions">
                <button class="btn-secondary nf-btn modal-close">Cancel</button>
                <button id="saveRosterBtn" class="btn-primary nf-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- DELETE ROSTER ENTRY MODAL -->
    <div id="deleteRosterModal" class="modal hidden">
        <div class="modal-content small modal-dark">
            <h2>Delete Roster Entry</h2>
            <p>Are you sure you want to remove this player from the roster?</p>

            <div class="modal-actions">
                <button class="btn-secondary nf-btn modal-close">Cancel</button>
                <button id="confirmDeleteRosterBtn" class="btn-danger nf-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- PAGE JS -->
    <script src="../js/rosters.js"></script>

</body>
</html>
