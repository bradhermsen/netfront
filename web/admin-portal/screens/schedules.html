<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Schedules | NetFront Admin</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/schedules.css" />

    <!-- Bootstrap ONLY for modals -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>

<body>

    <!-- LAYOUT -->
    <div id="layoutContainer"></div>

    <script>
        fetch("../components/layout.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("layoutContainer").innerHTML = html;

                // Inject page content
                document.getElementById("pageContent").innerHTML = `
                    <h1 class="page-header">Schedules</h1>

                    <button class="btn-primary nf-btn" onclick="openAddModal()">Add Game</button>

                    <table class="data-table" id="gamesTable">
                        <thead>
                            <tr>
                                <th>Home</th>
                                <th>Away</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Arena</th>
                                <th>Rink</th>
                                <th>Type</th>
                                <th>Round</th>
                                <th>Status</th>
                                <th style="width: 120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="gamesTableBody"></tbody>
                    </table>
                `;
            });
    </script>

    <!-- ============================
         ADD / EDIT GAME MODAL
    ============================= -->
    <div class="modal fade" id="gameModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content modal-dark">
                <div class="modal-header">
                    <h5 class="modal-title">Game Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="gameId" />

                    <div class="two-col-form">
                        <div>
                            <label>Home Team</label>
                            <select id="homeTeamId" class="form-select"></select>
                        </div>

                        <div>
                            <label>Away Team</label>
                            <select id="awayTeamId" class="form-select"></select>
                        </div>

                        <div>
                            <label>Date</label>
                            <input type="date" id="gameDate" class="form-control" />
                        </div>

                        <div>
                            <label>Time</label>
                            <input type="time" id="gameTime" class="form-control" />
                        </div>

                        <div>
                            <label>Arena</label>
                            <input type="text" id="arenaName" class="form-control" />
                        </div>

                        <div>
                            <label>Rink</label>
                            <input type="text" id="rinkName" class="form-control" />
                        </div>

                        <div>
                            <label>Game Type</label>
                            <select id="gameTypeId" class="form-select"></select>
                        </div>

                        <div>
                            <label>Game Round</label>
                            <select id="gameRoundId" class="form-select">
                                <option value="">None</option>
                            </select>
                        </div>

                        <div class="full-width">
                            <label>Notes</label>
                            <textarea id="notes" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn-secondary nf-btn" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn-primary nf-btn" onclick="saveGameFromForm()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE JS -->
    <script src="../js/schedules.js"></script>

    <!-- Bootstrap JS (modals only) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
