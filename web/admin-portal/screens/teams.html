<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | NetFront Admin</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/teams.css" />
</head>

<body>
    <div class="layout">

        <!-- SIDEBAR -->
        <div id="sidebarContainer"></div>

        <!-- MAIN CONTENT -->
        <div class="main-content">

            <!-- PAGE HEADER -->
            <div class="page-header">
                <h1>Teams</h1>
                <button id="btnAddTeam" class="btn-primary">Add Team</button>
            </div>

            <!-- SEARCH BAR -->
            <input 
                type="text" 
                id="teams-search-bar" 
                class="search-bar"
                placeholder="Search teams..."
            >

            <!-- TEAMS TABLE -->
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="sortable" onclick="sortTeams('name')">Team Name</th>
                        <th class="sortable" onclick="sortTeams('organizationName')">Organization</th>
                        <th class="sortable" onclick="sortTeams('levelName')">Level</th>
                        <th class="sortable" onclick="sortTeams('seasonName')">Season</th>
                        <th class="sortable" onclick="sortTeams('rosterCount')">Roster</th>
                        <th class="sortable" onclick="sortTeams('headCoachName')">Head Coach</th>
                        <th class="access-codes-header">Access Codes</th>
                        <th class="sortable" onclick="sortTeams('isActive')">Active</th>
                        <th class="actions-col">Actions</th>
                    </tr>
                </thead>
                <tbody id="teamsBody"></tbody>
            </table>

        </div>
    </div>

    <!-- ADD / EDIT TEAM MODAL -->
    <div id="teamModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="teamModalTitle">Add Team</h2>

            <div class="modal-body two-col-form">

                <!-- LEFT COLUMN -->
                <div class="form-col">
                    <label>Team Name</label>
                    <input id="team-name" type="text" />

                    <label>Organization</label>
                    <select id="team-org"></select>

                    <label>Level</label>
                    <select id="team-level"></select>

                    <label>Season</label>
                    <select id="team-season"></select>

                    <label>Head Coach</label>
                    <input id="team-head-coach" type="text" />
                </div>

                <!-- RIGHT COLUMN -->
                <div class="form-col">
                    <label>Assistant Coach 1</label>
                    <input id="team-asst1" type="text" />

                    <label>Assistant Coach 2</label>
                    <input id="team-asst2" type="text" />

                    <label>Assistant Coach 3</label>
                    <input id="team-asst3" type="text" />

                    <label>Assistant Coach 4</label>
                    <input id="team-asst4" type="text" />

                    <label>Notes</label>
                    <textarea id="team-notes"></textarea>

                    <!-- ACCESS CODE FIELDS -->
                    <label>Scorekeeper Code</label>
                    <input id="team-score-code" type="text" />

                    <label>Stat Manager Code</label>
                    <input id="team-stat-code" type="text" />


                </div>

                <!-- FULL WIDTH: GENERATE CODES BUTTON -->
                <div class="form-col-full">
                    <button id="btnGenerateCodes" class="generate-codes-btn">
                        Generate Access Codes
                    </button>
                </div>

                <!-- FULL WIDTH: TOGGLES -->
                <div class="form-col-full">
                    <div class="form-row toggle-row mt-2">
                        <label>Active</label>
                        <label class="switch">
                            <input type="checkbox" id="team-active" />
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div class="form-row toggle-row mt-1">
                        <label>External Team</label>
                        <label class="switch">
                            <input type="checkbox" id="team-external" />
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

            </div>

            <div class="modal-actions">
                <button id="btnCancelTeam" class="btn-secondary">Cancel</button>
                <button id="btnSaveTeam" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- DELETE TEAM MODAL -->
    <div id="teamDeleteModal" class="modal hidden">
        <div class="modal-content small">
            <h2>Delete Team</h2>
            <p>Are you sure you want to delete this team?</p>

            <div class="modal-actions">
                <button id="btnCancelTeamDelete" class="btn-secondary">Cancel</button>
                <button id="btnConfirmTeamDelete" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- LOAD SCRIPTS -->
    <script src="../js/sidebar-loader.js"></script>
    <script>loadSidebar("teams.html");</script>

    <script src="../api/team-api.js"></script>
    <script src="../js/teams.js"></script>

</body>
</html>
