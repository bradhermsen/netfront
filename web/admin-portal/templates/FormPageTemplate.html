<!-- =========================================================
     FORM PAGE TEMPLATE
========================================================= -->

<div class="nf-card w-full" style="max-width: 600px; margin: auto">
  <h2 class="text-xl mb-4">Form Title</h2>

  <div class="flex flex-col gap-3">
    <div>
      <label class="nf-label">Field Label</label>
      <input type="text" class="nf-input" id="fieldInput" />
    </div>

    <div>
      <label class="nf-label">Select Label</label>
      <select class="nf-select" id="selectInput">
        <option value="">Choose...</option>
      </select>
    </div>

    <div>
      <label class="nf-label">Description</label>
      <textarea class="nf-textarea" id="descriptionInput"></textarea>
    </div>
  </div>

  <div class="nf-modal-actions mt-4">
    <button class="nf-btn nf-btn-secondary" id="btnCancel">Cancel</button>
    <button class="nf-btn nf-btn-primary" id="btnSave">Save</button>
  </div>
</div>
