<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Goal</title>
    <link rel="stylesheet" href="../css/add-goal.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Record Goal</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- TEAM HEADER -->
        <div class="team-header">
            <span class="team-name"></span>
        </div>

        <!-- GOAL FORM -->
        <div class="card goal-card">

            <!-- Scorer -->
            <div class="form-row">
                <label>Goal Scorer</label>
                <select class="input scorer-select"></select>
            </div>

            <!-- Assist 1 -->
            <div class="form-row">
                <label>Assist 1 (optional)</label>
                <select class="input assist1-select"></select>
            </div>

            <!-- Assist 2 -->
            <div class="form-row">
                <label>Assist 2 (optional)</label>
                <select class="input assist2-select"></select>
            </div>

            <!-- Period -->
            <div class="form-row">
                <label>Period</label>
                <select class="input period-select"></select>
            </div>

            <!-- Time -->
            <div class="form-row">
                <label>Time (MM:SS)</label>
                <input class="input time-input" placeholder="00:00">
            </div>

            <!-- Goal Type -->
            <div class="form-row">
                <label>Goal Type</label>
                <div class="goal-type-grid">
                    <button class="goal-type-btn" data-type="even">Even Strength</button>
                    <button class="goal-type-btn" data-type="pp">Power Play</button>
                    <button class="goal-type-btn" data-type="sh">Short-Handed</button>
                    <button class="goal-type-btn" data-type="en">Empty Net</button>
                    <button class="goal-type-btn" data-type="ps">Penalty Shot</button>
                </div>
            </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-row">
            <button class="cancel-btn">Cancel</button>
            <button class="submit-btn">Record Goal</button>
        </div>

    </div>

</div>

<script type="module" src="../js/add-goal.js"></script>
</body>
</html>
