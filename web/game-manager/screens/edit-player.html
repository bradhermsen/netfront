<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Player</title>
    <link rel="stylesheet" href="../css/edit-player.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Edit Player</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- PLAYER HEADER -->
        <div class="card player-header-card">
            <div class="player-header-row">
                <div class="player-jersey"></div>
                <div class="player-info">
                    <div class="player-name"></div>
                    <div class="player-meta"></div>
                </div>
            </div>
        </div>

        <!-- EDIT FORM -->
        <div class="card edit-card">

            <div class="form-row">
                <label>Name</label>
                <input class="input name-input">
            </div>

            <div class="form-row">
                <label>Jersey Number</label>
                <input class="input jersey-input" type="number">
            </div>

            <div class="form-row">
                <label>Position</label>
                <select class="input position-select">
                    <option value="F">Forward</option>
                    <option value="D">Defense</option>
                    <option value="G">Goalie</option>
                </select>
            </div>

            <div class="form-row">
                <label>Shoots</label>
                <select class="input shoots-select">
                    <option value="L">Left</option>
                    <option value="R">Right</option>
                </select>
            </div>

            <div class="form-row">
                <label>Graduation Year</label>
                <input class="input gradyear-input" type="number">
            </div>

            <div class="form-row">
                <label>Height (e.g., 5'8")</label>
                <input class="input height-input">
            </div>

            <div class="form-row">
                <label>Weight (lbs)</label>
                <input class="input weight-input" type="number">
            </div>

            <div class="form-row toggle-row">
                <label>Active</label>
                <button class="toggle-btn active-toggle"></button>
            </div>

            <div class="form-row toggle-row goalie-only">
                <label>Starter Goalie</label>
                <button class="toggle-btn starter-toggle"></button>
            </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-row">
            <button class="back-btn">Back</button>
            <button class="save-btn">Save Changes</button>
        </div>

    </div>

</div>

<script type="module" src="../js/edit-player.js"></script>
</body>
</html>
