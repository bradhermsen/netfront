<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Roster</title>
    <link rel="stylesheet" href="../css/edit-roster.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Edit Roster</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- TEAM HEADER -->
        <div class="team-header">
            <span class="team-name"></span>
        </div>

        <!-- ROSTER EDIT LIST -->
        <div class="card roster-edit-card">
            <div class="card-title">Players</div>
            <div class="edit-list"></div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-row">
            <button class="back-btn">Cancel</button>
            <button class="save-btn">Save Changes</button>
        </div>

    </div>

</div>

<script type="module" src="../js/edit-roster.js"></script>
</body>
</html>
