<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Summary</title>
    <link rel="stylesheet" href="../css/email-summary.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Email Summary</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- GAME HEADER -->
        <div class="card game-header-card">
            <div class="game-header-row">
                <span class="game-title"></span>
                <span class="game-score"></span>
            </div>
        </div>

        <!-- HEAD COACHES -->
        <div class="card category-card">
            <div class="category-title">Head Coaches</div>
            <div class="category-list coaches-list"></div>
        </div>

        <!-- REFEREES -->
        <div class="card category-card">
            <div class="category-title">Referees</div>
            <div class="category-list referees-list"></div>
        </div>

        <!-- MEDIA OUTLETS -->
        <div class="card category-card">
            <div class="category-title">Media Outlets</div>
            <div class="category-list media-list"></div>
        </div>

        <!-- OTHER EMAIL -->
        <div class="card other-card">
            <div class="category-title">Other Email</div>
            <input class="input other-email-input" placeholder="name@example.com">
        </div>

        <!-- SEND BUTTON -->
        <div class="send-wrapper">
            <button class="send-btn">Send Summary</button>
        </div>

        <!-- BACK -->
        <div class="back-wrapper">
            <button class="back-btn">Back to Summary</button>
        </div>

    </div>

</div>

<script type="module" src="../js/email-summary.js"></script>
</body>
</html>
