<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Officials</title>
    <link rel="stylesheet" href="../css/game-officials.css">
</head>
<body>

<div class="modal-overlay">

    <div class="modal-card">

        <!-- HEADER -->
        <div class="modal-header">
            <span class="modal-title">Game Officials</span>
            <button class="close-btn">✕</button>
        </div>

        <!-- OFFICIALS FORM -->
        <div class="modal-body">

            <div class="form-row">
                <label>Referee 1</label>
                <input class="input ref1-input" placeholder="Enter name">
            </div>

            <div class="form-row">
                <label>Referee 2</label>
                <input class="input ref2-input" placeholder="Enter name">
            </div>

            <div class="form-row">
                <label>Linesman 1</label>
                <input class="input line1-input" placeholder="Enter name">
            </div>

            <div class="form-row">
                <label>Linesman 2</label>
                <input class="input line2-input" placeholder="Enter name">
            </div>

            <div class="form-row">
                <label>Game Notes</label>
                <textarea class="input notes-input" placeholder="Optional notes..."></textarea>
            </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="modal-footer">
            <button class="cancel-btn">Cancel</button>
            <button class="save-btn">Save</button>
        </div>

    </div>

</div>

<script type="module" src="../js/game-officials.js"></script>
</body>
</html>
