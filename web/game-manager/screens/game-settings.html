<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Settings</title>
    <link rel="stylesheet" href="../css/game-settings.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Game Settings</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- GAME HEADER -->
        <div class="card game-header-card">
            <div class="game-header-row">
                <span class="team-vs"></span>
                <span class="game-date"></span>
            </div>
        </div>

        <!-- GAME TYPE -->
        <div class="card">
            <div class="card-title">Game Type</div>
            <select class="input game-type-select">
                <option value="">Select</option>
                <option value="Regular">Regular Season</option>
                <option value="Playoff">Playoff</option>
                <option value="Exhibition">Exhibition</option>
                <option value="Tournament">Tournament</option>
            </select>
        </div>

        <!-- PERIOD LENGTH -->
        <div class="card">
            <div class="card-title">Period Length (minutes)</div>
            <input class="input period-length-input" type="number" placeholder="17">
        </div>

        <!-- CLOCK MODE -->
        <div class="card">
            <div class="card-title">Clock Mode</div>
            <div class="clock-mode-row">
                <button class="clock-btn" data-mode="auto">Automatic</button>
                <button class="clock-btn" data-mode="manual">Manual</button>
            </div>
            <div class="clock-warning"></div>
        </div>

        <!-- RINK / VENUE -->
        <div class="card">
            <div class="card-title">Venue</div>
            <input class="input venue-input" placeholder="Rink Name">
        </div>

        <!-- NOTES -->
        <div class="card">
            <div class="card-title">Game Notes</div>
            <textarea class="input notes-input" placeholder="Optional notes..."></textarea>
        </div>

        <!-- OFFICIALS -->
        <div class="card">
            <div class="card-title">Officials</div>
            <button class="officials-btn">Edit Officials</button>
        </div>

        <!-- LINEUP -->
        <div class="card">
            <div class="card-title">Lineup</div>
            <button class="lineup-btn">Set Lineup</button>
        </div>

        <!-- START GAME -->
        <div class="start-wrapper">
            <button class="start-btn disabled">Start Game</button>
        </div>

        <!-- BACK -->
        <div class="back-wrapper">
            <button class="back-btn">Back</button>
        </div>

    </div>

</div>

<script type="module" src="../js/game-settings.js"></script>
</body>
</html>
