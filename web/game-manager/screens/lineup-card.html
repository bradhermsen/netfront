<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lineup Card</title>
    <link rel="stylesheet" href="../css/lineup-card.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Lineup Card</span>
        </div>
        <div class="top-right">
            <button class="print-btn">Print</button>
        </div>
    </div>

    <div class="screen-body">

        <!-- TEAM HEADER -->
        <div class="team-header">
            <span class="team-name"></span>
            <span class="game-info"></span>
        </div>

        <!-- FORWARD LINES -->
        <div class="card">
            <div class="card-title">Forward Lines</div>
            <div class="line-list forwards-list"></div>
        </div>

        <!-- DEFENSE PAIRS -->
        <div class="card">
            <div class="card-title">Defense Pairs</div>
            <div class="line-list defense-list"></div>
        </div>

        <!-- GOALIES -->
        <div class="card">
            <div class="card-title">Goalies</div>
            <div class="goalie-row">
                <div class="goalie-block">
                    <label>Starter</label>
                    <select class="input goalie-starter"></select>
                </div>
                <div class="goalie-block">
                    <label>Backup</label>
                    <select class="input goalie-backup"></select>
                </div>
            </div>
        </div>

        <!-- SPECIAL TEAMS -->
        <div class="card">
            <div class="card-title">Power Play</div>
            <div class="line-list pp-list"></div>
        </div>

        <div class="card">
            <div class="card-title">Penalty Kill</div>
            <div class="line-list pk-list"></div>
        </div>

        <div class="card">
            <div class="card-title">6-on-5 Unit</div>
            <div class="line-list six-list"></div>
        </div>

        <!-- OPPONENT LINES -->
        <div class="card">
            <div class="card-title">Opponent Lines</div>
            <textarea class="input opponent-input" placeholder="Enter opponent lines..."></textarea>
        </div>

        <!-- PERIOD NOTES -->
        <div class="card">
            <div class="card-title">Period Notes</div>
            <textarea class="input period-notes-input" placeholder="Notes for this period..."></textarea>
        </div>

        <!-- POST-GAME NOTES -->
        <div class="card">
            <div class="card-title">Post-Game Notes</div>
            <textarea class="input post-notes-input" placeholder="Post-game notes..."></textarea>
        </div>

        <!-- SAVE BUTTON -->
        <div class="save-wrapper">
            <button class="save-btn">Save Lineup</button>
        </div>

        <!-- BACK -->
        <div class="back-wrapper">
            <button class="back-btn">Back to Stats</button>
        </div>

    </div>

</div>

<script type="module" src="../js/lineup-card.js"></script>
</body>
</html>
