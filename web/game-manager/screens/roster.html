<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roster</title>
    <link rel="stylesheet" href="../css/roster.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Roster</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- TEAM HEADER -->
        <div class="team-header">
            <span class="team-name"></span>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-row">
            <button class="add-player-btn">Add Player</button>
            <button class="edit-roster-btn">Edit Roster</button>
        </div>

        <!-- ROSTER LIST -->
        <div class="card roster-card">
            <div class="card-title">Players</div>
            <div class="roster-list"></div>
        </div>

    </div>

</div>

<script type="module" src="../js/roster.js"></script>
</body>
</html>
