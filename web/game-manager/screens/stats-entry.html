<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stats Entry</title>
    <link rel="stylesheet" href="../css/stats-entry.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Player Stats</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- PLAYER SELECTOR -->
        <div class="player-selector">
            <div class="player-scroll"></div>
        </div>

        <!-- PLAYER HEADER -->
        <div class="player-header">
            <span class="player-name"></span>
            <span class="player-position"></span>
        </div>

        <!-- STATS CARD -->
        <div class="card stats-card">

            <!-- SCORING -->
            <div class="section-title">Scoring</div>
            <div class="stat-row">
                <span>Goals</span>
                <div class="stat-controls" data-stat="goals">
                    <button class="minus">−</button>
                    <span class="value goals-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Assists</span>
                <div class="stat-controls" data-stat="assists">
                    <button class="minus">−</button>
                    <span class="value assists-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row auto-field">
                <span>Points</span>
                <span class="auto-value points-value"></span>
            </div>

            <!-- SHOTS & POSSESSION -->
            <div class="section-title">Shots & Possession</div>

            <div class="stat-row">
                <span>Shots on Goal</span>
                <div class="stat-controls" data-stat="sog">
                    <button class="minus">−</button>
                    <span class="value sog-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Missed Shots</span>
                <div class="stat-controls" data-stat="missed">
                    <button class="minus">−</button>
                    <span class="value missed-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Blocked by Opponent</span>
                <div class="stat-controls" data-stat="blocked">
                    <button class="minus">−</button>
                    <span class="value blocked-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Faceoff Wins</span>
                <div class="stat-controls" data-stat="fow">
                    <button class="minus">−</button>
                    <span class="value fow-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Faceoff Losses</span>
                <div class="stat-controls" data-stat="fol">
                    <button class="minus">−</button>
                    <span class="value fol-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row auto-field">
                <span>FO%</span>
                <span class="auto-value fopct-value"></span>
            </div>

            <!-- DISCIPLINE & EFFORT -->
            <div class="section-title">Discipline & Effort</div>

            <div class="stat-row">
                <span>Hits</span>
                <div class="stat-controls" data-stat="hits">
                    <button class="minus">−</button>
                    <span class="value hits-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Blocked Shots</span>
                <div class="stat-controls" data-stat="bs">
                    <button class="minus">−</button>
                    <span class="value bs-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Giveaways</span>
                <div class="stat-controls" data-stat="ga">
                    <button class="minus">−</button>
                    <span class="value ga-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <div class="stat-row">
                <span>Takeaways</span>
                <div class="stat-controls" data-stat="ta">
                    <button class="minus">−</button>
                    <span class="value ta-value"></span>
                    <button class="plus">+</button>
                </div>
            </div>

            <!-- ICE TIME -->
            <div class="section-title">Ice Time</div>

            <div class="ice-row">
                <span>Total TOI</span>
                <button class="timer-btn toi-btn">▶</button>
                <span class="ice-value toi-value"></span>
            </div>

            <div class="ice-row">
                <span>PP Time</span>
                <button class="timer-btn pp-btn">▶</button>
                <span class="ice-value pp-value"></span>
            </div>

            <div class="ice-row">
                <span>PK Time</span>
                <button class="timer-btn pk-btn">▶</button>
                <span class="ice-value pk-value"></span>
            </div>

        </div>

        <!-- SAVE BUTTON -->
        <div class="save-wrapper">
            <button class="save-btn">Save Stats</button>
        </div>

    </div>

</div>

<script type="module" src="../js/stats-entry.js"></script>
</body>
</html>
