<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Summary</title>
    <link rel="stylesheet" href="../css/summary.css">
</head>
<body>

<div class="phone-frame">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="logo-text">NF</span>
            <span class="app-name">Game Summary</span>
        </div>
        <div class="top-right"></div>
    </div>

    <div class="screen-body">

        <!-- FINAL SCORE -->
        <div class="card final-score-card">
            <div class="final-score-row">
                <div class="team-block home-team">
                    <span class="team-name home-team-name"></span>
                    <span class="team-score home-score"></span>
                </div>

                <div class="final-divider">FINAL</div>

                <div class="team-block away-team">
                    <span class="team-name away-team-name"></span>
                    <span class="team-score away-score"></span>
                </div>
            </div>
        </div>

        <!-- TEAM COMPARISON -->
        <div class="card comparison-card">
            <div class="card-title">Team Comparison</div>
            <div class="comparison-list"></div>
        </div>

        <!-- SCORING SUMMARY -->
        <div class="card scoring-card">
            <div class="card-title">Scoring Summary</div>
            <div class="scoring-list"></div>
        </div>

        <!-- PENALTY SUMMARY -->
        <div class="card penalty-card">
            <div class="card-title">Penalty Summary</div>
            <div class="penalty-list"></div>
        </div>

        <!-- PERIOD STATS -->
        <div class="card period-card">
            <div class="card-title">Period Stats</div>
            <div class="period-list"></div>
        </div>

        <!-- EXPORT BUTTONS -->
        <div class="export-row">
            <button class="export-btn pdf-btn">PDF</button>
            <button class="export-btn csv-btn">CSV</button>
            <button class="export-btn email-btn">Email Summary</button>
        </div>

        <!-- BACK TO GAME -->
        <div class="back-wrapper">
            <button class="back-btn">Back to Game</button>
        </div>

    </div>

</div>

<script type="module" src="../js/summary.js"></script>
</body>
</html>
